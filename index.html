<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cuartelamigo.cl</title>
    <script>
      (function () {
        var publicHosts = ['www.cuartelamigo.cl', 'cuartelamigo.cl'];
        var appOnlyPaths = ['/login', '/register', '/recuperar-password', '/restablecer-password', '/dashboard'];
        var isPublicHost = publicHosts.indexOf(window.location.hostname) !== -1;
        var isAppOnlyPath = appOnlyPaths.some(function (path) {
          return window.location.pathname === path || window.location.pathname.indexOf(path + '/') === 0;
        });

        if (isPublicHost && isAppOnlyPath) {
          window.location.replace('https://app.cuartelamigo.cl' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
