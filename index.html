<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuartelAmigo</title>
    <script>
      (function () {
        var hostname = window.location.hostname;
        var isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]';
        if (isLocalhost) return;

        var isLanding = window.location.pathname === '/' || window.location.pathname === '/index.html';
        var canonicalHost = isLanding ? 'www.cuartelamigo.cl' : 'app.cuartelamigo.cl';
        if (hostname === canonicalHost) return;

        window.location.replace(
          'https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash
        );
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
